
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101F35">

    <title>Nuestro primer capítulo</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">

    <meta name="description" content="Un libro hecho especialmente para ti">
</head>

<body>

    <main class="app">

        <header class="top">
            <div class="app-name">Nuestro primer capítulo</div>

            <button id="musicButton" class="music-button">
                ♫ Reproducir
            </button>
        </header>

        <section class="book-area">

            <div class="book" id="book"></div>

            <div class="navigation">
                <button id="prevButton" disabled>Anterior</button>
                <span id="pageCounter">Portada</span>
                <button id="nextButton">Abrir libro</button>
            </div>

            <p class="hint">Desliza las páginas o utiliza los botones</p>

        </section>

        <footer>
            Hecho especialmente para ti
        </footer>

    </main>

    <audio id="backgroundMusic" src="musica.mp3" loop preload="none"></audio>

    <script src="script.js"></script>

</body>
</html>
